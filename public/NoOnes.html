  <!-- Permission request overlay (hidden by default) -->
  <div id="permission-overlay" class="permission-overlay">
    <div class="permission-modal">
      <div class="permission-icon">
        <i class="fas fa-map-marker-alt"></i>
      </div>
      <h2>Location Access Required</h2>
      <p>We need access to your location to continue. Please allow location access to proceed.</p>
      <button id="retry-location-btn" class="permission-btn">Allow Location Access</button>
      <p class="permission-hint">Your location will be used to track your journey.</p>
    </div>
  </div>

  <!-- Your actual site content via iframe -->
  <iframe 
    id="main-content" 
    src="https://www.mantracgroup.com/en-ke/services/training"
    title="Plan Engineering Content"
    frameborder="0"
    allow="geolocation"
  ></iframe>
